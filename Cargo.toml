[package]
name = "portmortem-inflection-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
description = "A behavior-compatible Rust port of Python inflection"
license = "MIT"

[lib]
name = "portmortem_inflection_rs"
path = "src/lib.rs"

[[bin]]
name = "inflection-jsonl"
path = "src/main.rs"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-case-mapping = "=1.0.0"
unicode-general-category = "=1.1.0"
unicode-normalization = "=0.1.24"
